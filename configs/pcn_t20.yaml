method: pcn
seed: 42
batch_size: 128
epochs: 10
hidden: [256, 128]
num_classes: 10
data_dir: data
num_workers: 0
runs_dir: runs
T_infer: 20
T_infer_test: 200
lr_infer: 0.05
# Low T_infer => noisy weight updates; use tiny lr + few learn steps + early stop
lr_learn: 0.001
T_learn: 8
early_stop_patience: 2
activation: tanh
input_scale: bipolar
